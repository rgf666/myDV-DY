name: Build TvDouyinWebView APK

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: 'recursive'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-overwrite-existing: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      if: github.event.inputs.build_type == 'debug' || github.event_name == 'push' || github.event_name == 'pull_request'
      run: |
        ./gradlew :app:assembleDebug --stacktrace

    - name: Build Release APK
      if: github.event.inputs.build_type == 'release'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        VERSION_CODE: ${{ github.run_number }}
      run: |
        ./gradlew :app:assembleRelease --stacktrace

    - name: Upload Debug APK
      if: github.event.inputs.build_type == 'debug' || github.event_name == 'push' || github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      if: github.event.inputs.build_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Create Release (Release only)
      if: github.event.inputs.build_type == 'release' && github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*.apk
        tag_name: v${{ github.run_number }}
        name: TvDouyinWebView v${{ github.run_number }}
        body: |
          ## TvDouyinWebView 自动构建
          
          **功能**：
          - ✅ 抖音精选视频
          - ✅ 弹幕显示
          - ✅ Cookie 登录
          - ✅ 手势操作
          - ✅ 导航栏
          
          **安装**：下载 APK 后安装到手机/TV 设备
        generate_release_notes: true
        prerelease: false
