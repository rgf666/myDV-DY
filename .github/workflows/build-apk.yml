name: Build TvDouyinWebView APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
        - debug
        - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin

    - name: Setup Android SDK
      run: |
        SDK=/usr/local/lib/android/sdk
        if [ -d "$SDK" ]; then
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "Found SDK at $SDK"
          ls "$SDK/platforms/" 2>/dev/null
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SM" ]; then
            yes | "$SM" --install "platforms;android-34" 2>&1 || true
            yes | "$SM" --licenses 2>&1 || true
          fi
        else
          echo "SDK not found at $SDK"
          ls /usr/local/lib/android/ 2>/dev/null || echo "No android dir"
        fi

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle wrapper
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
